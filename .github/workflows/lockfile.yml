name: lockfile

on:
  pull_request:

jobs:
  lockfile-sync:
    name: bun install --frozen-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Fail on lockfile drift
        run: bun install --frozen-lockfile
