name: lockfile

on:
  pull_request:

jobs:
  lockfile-sync:
    name: lockfile drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve and report lockfile drift
        run: |
          bun install --frozen-lockfile && echo "LOCKFILE_OK=1" >> "$GITHUB_ENV" || true
          if [ -z "$LOCKFILE_OK" ]; then
            echo "::group::Lockfile drift detected — resolved content below"
            git diff -- bun.lock
            echo "::endgroup::"
            echo "Commit the printed bun.lock changes, or align package.json manifests with bun.lock."
            exit 1
          fi
