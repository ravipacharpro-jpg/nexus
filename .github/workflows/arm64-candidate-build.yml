name: arm64-candidate-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: itzgeniusboy/nexus
          ref: v0.1.59

      - name: Record exact commit
        run: |
          git rev-parse HEAD | tee commit.txt
          echo "expected: 07511f4e7e6b26703e43cfe00d056ba2056ad45d"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Bun version proof
        run: bun --version | tee bunversion.txt

      - name: Frozen lockfile check (diagnostic, must not block)
        id: frozen
        continue-on-error: true
        run: bun install --frozen-lockfile

      - name: Resolve dependencies (pipeline-normal)
        run: bun install

      - name: Build linux-arm64 candidate (no shims, no manual nesting)
        run: cd packages/nexus && bun run script/build.ts --target=linux-arm64 --skip-embed-web-ui

      - name: Package + checksums
        run: |
          cd packages/nexus/dist
          tar czf nexus-linux-arm64-0.1.59.tar.gz -C nexus-linux-arm64 .
          sha256sum nexus-linux-arm64-0.1.59.tar.gz | tee SHA256SUMS.txt
          {
            echo "commit=$(cat ../../commit.txt)"
            echo "bun=$(cat ../../bunversion.txt)"
            echo "frozen_lockfile_result=${{ steps.frozen.outcome }}"
          } > BUILD_META.txt

      - name: Upload non-release artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-arm64-0.1.59-candidate
          path: |
            packages/nexus/dist/nexus-linux-arm64-0.1.59.tar.gz
            packages/nexus/dist/SHA256SUMS.txt
            packages/nexus/dist/BUILD_META.txt
            packages/nexus/dist/commit.txt
            packages/nexus/dist/bunversion.txt
          retention-days: 30
