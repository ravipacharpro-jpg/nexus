name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux-arm64, linux-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Resolve version
        id: ver
        run: echo "version=${{ github.event.inputs.version }}" | sed 's/^v*//' >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.target }}
        working-directory: packages/nexus
        env:
          NEXUS_VERSION: ${{ steps.ver.outputs.version }}
          NEXUS_CHANNEL: latest
        run: bun run build --target=${{ matrix.target }}

      - name: Package tarball
        working-directory: packages/nexus/dist
        run: |
          NAME="nexus-${{ matrix.target }}"
          VERSION="${{ steps.ver.outputs.version }}"
          tar -czf "${NAME}-${VERSION}.tar.gz" -C "${NAME}/bin" nexus package.json

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ matrix.target }}
          path: packages/nexus/dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION#v}"
          gh release create "$TAG" dist/*.tar.gz \
            --repo "${{ github.repository }}" \
            --title "NEXUS ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            --latest || gh release upload "$TAG" dist/*.tar.gz --repo "${{ github.repository }}" --clobber
