name: build-node_modules

on:
  workflow_dispatch:
  push:
    tags:
      - "nexus-artifacts-*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies (self-contained copy backend)
        run: bun install --backend copy

      - name: Bundle node_modules
        run: tar -cJf node_modules.tar.xz node_modules

      - name: Upload node_modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: node_modules.tar.xz
          compression-level: 0
          retention-days: 5
          if-no-files-found: error
