name: Build node_modules artifact

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build portable node_modules (arm64)
    # x64: bun materializes node_modules correctly here (verified by passing
    # test.yml). arm64 bun does NOT materialize node_modules, so we build on x64
    # and rebuild only the native modules for arm64 at runtime.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system build deps (node-pty / native modules)
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      # On arm64, a failing postinstall script makes bun roll back node_modules,
      # leaving it empty. --ignore-scripts keeps node_modules materialized
      # (hardlinks). Native modules (node-pty) are built separately at runtime if
      # needed.
      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Verify node_modules materialized
        run: |
          test -d node_modules/zod && echo "zod present OK" || (echo "zod MISSING"; exit 1)
          test -d node_modules/@ai-sdk && echo "@ai-sdk present OK" || (echo "@ai-sdk MISSING"; exit 1)

      - name: Tar node_modules (dereference hardlinks for portability)
        run: tar --hard-dereference -cf node_modules.tar node_modules

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node_modules-arm64
          path: node_modules.tar
          retention-days: 7
