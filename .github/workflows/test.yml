name: Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test matrix (low-memory safe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system build deps (node-pty / native modules)
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test matrix
        run: bash script/test-lowmem.sh
