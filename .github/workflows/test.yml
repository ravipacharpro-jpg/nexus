name: Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test matrix (low-memory safe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Newer "latest" regressed node_modules materialization on x64.
          bun-version: "1.4.0"

      - name: Install system build deps (node-pty / native modules)
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      # Hardlink backend fails to materialize node_modules on this bun/x64 combo;
      # --backend copy is the proven materialization path (see build-node_modules.yml).
      - name: Install dependencies
        run: bun install --backend copy

      - name: Run test matrix
        # NEXUS_FULL_TESTS=1 runs the full per-package matrix; the default is a
        # no-op that exits 0 with "nothing ran".
        env:
          NEXUS_FULL_TESTS: "1"
        run: bash script/test-lowmem.sh
